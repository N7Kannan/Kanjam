name: Build KANJAM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: kanjam
        run: bash tools/setup_android.sh

      - name: Install dependencies
        working-directory: kanjam
        run: flutter pub get

      - name: Build release APK
        working-directory: kanjam
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanjam-apk
          path: kanjam/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
