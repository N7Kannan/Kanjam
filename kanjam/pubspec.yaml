name: kanjam
description: KANJAM - Every Rupee Counts. A student-friendly personal finance tracker.
publish_to: "none"
# Keep in sync with AppConstants.appVersion / appBuild in lib/core/constants.dart.
# versionCode must be higher than the old APK (1) so it installs as an upgrade.
version: 1.1.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  intl: ^0.20.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
